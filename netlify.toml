# Netlify deploy config — static site, no build step.
# Git-based auto-deploy: connect this repo in Netlify; publish dir is the repo root.
[build]
  publish = "."
  command = ""

# Native Netlify Forms are detected from the deployed HTML (data-netlify="true"
# + a hidden form-name input on each form). The Jobs form uses a native file
# input for CV uploads (enctype="multipart/form-data"). Configure notification
# emails to languages@kantor-communication.com (with distinct subjects per form)
# in the Netlify dashboard: Site settings → Forms → Form notifications.

[[redirects]]
  from = "/contact"
  to = "/#contact"
  status = 301

# ---------------------------------------------------------------------------
# English-first launch (November 2026): the Hungarian pages
# still carry the previous design and copy. Until they are re-translated, their
# addresses lead to the matching English page. The German legal pages stay
# reachable because the English legal notice refers to them as binding.
# Remove this block once the translated pages are rebuilt.
[[redirects]]
  from = "/de/impressum.html"
  to = "/de/impressum.html"
  status = 200
  force = true
[[redirects]]
  from = "/de/impressum"
  to = "/de/impressum.html"
  status = 200
  force = true
[[redirects]]
  from = "/de/datenschutz.html"
  to = "/de/datenschutz.html"
  status = 200
  force = true
[[redirects]]
  from = "/de/datenschutz"
  to = "/de/datenschutz.html"
  status = 200
  force = true
# German (November 2026): the redesigned pages are live under /de/. The FAQ is not
# translated yet, so its old German copy leads to English. The German Impressum and
# Datenschutz pages stay as they are (binding versions).
[[redirects]]
  from = "/de/faq.html"
  to = "/faq.html"
  status = 302
  force = true
[[redirects]]
  from = "/de/faq"
  to = "/faq.html"
  status = 302
  force = true
# Spanish (November 2026): the redesigned pages are live under /es/. The FAQ and the
# legal pages are not translated yet, so their old Spanish copies lead to English.
[[redirects]]
  from = "/es/faq.html"
  to = "/faq.html"
  status = 302
  force = true
[[redirects]]
  from = "/es/faq"
  to = "/faq.html"
  status = 302
  force = true
[[redirects]]
  from = "/es/impressum.html"
  to = "/impressum.html"
  status = 302
  force = true
[[redirects]]
  from = "/es/impressum"
  to = "/impressum.html"
  status = 302
  force = true
[[redirects]]
  from = "/es/datenschutz.html"
  to = "/datenschutz.html"
  status = 302
  force = true
[[redirects]]
  from = "/es/datenschutz"
  to = "/datenschutz.html"
  status = 302
  force = true
[[redirects]]
  from = "/hu"
  to = "/"
  status = 302
  force = true
[[redirects]]
  from = "/hu/*"
  to = "/:splat"
  status = 302
  force = true
